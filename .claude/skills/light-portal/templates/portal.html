<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f7f5f0; --panel: #ffffff; --ink: #22201c; --muted: #6a645b; --line: #e6e1d6; --soft: #f0ece3;
  --accent: #c2572f; --accent-ink: #ffffff; --accent-soft: #f8e3d9;
  --ok: #2f7a4b; --ok-soft: #e0f0e5; --warn: #9a6400; --warn-soft: #f8ecd2; --bad: #b0352b; --bad-soft: #f8e1de;
  --user: #6c3fa0; --user-soft: #efe6f8; --ai: #23657a; --ai-soft: #dff0f4;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171513; --panel: #211e1b; --ink: #ece7df; --muted: #a39b8f; --line: #36312b; --soft: #2a2622;
    --accent: #f08a5d; --accent-ink: #1d120c; --accent-soft: #3a261c;
    --ok: #7cc795; --ok-soft: #1f3327; --warn: #e2b55c; --warn-soft: #382d17; --bad: #f08b80; --bad-soft: #3a2220;
    --user: #c9a3f0; --user-soft: #30253d; --ai: #7fc6da; --ai-soft: #1c3138; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171513; --panel: #211e1b; --ink: #ece7df; --muted: #a39b8f; --line: #36312b; --soft: #2a2622;
  --accent: #f08a5d; --accent-ink: #1d120c; --accent-soft: #3a261c;
  --ok: #7cc795; --ok-soft: #1f3327; --warn: #e2b55c; --warn-soft: #382d17; --bad: #f08b80; --bad-soft: #3a2220;
  --user: #c9a3f0; --user-soft: #30253d; --ai: #7fc6da; --ai-soft: #1c3138; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 18px 0 8px; }
.top h1 { font-size: 21px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.theme { margin-left: auto; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
nav { display: flex; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main.wrap { padding-top: 22px; padding-bottom: 40px; }
h2 { font-size: 17px; margin: 24px 0 10px; }
h2:first-child { margin-top: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; min-width: 0; overflow-wrap: anywhere; }
.card + .card { margin-top: 12px; }
.grid .card + .card { margin-top: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
.stat .v { font-size: 24px; font-weight: 650; } .stat .k { color: var(--muted); font-size: 13px; }
.pill { display: inline-block; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; font-weight: 600; }
.pill.user { background: var(--user-soft); color: var(--user); } .pill.ai { background: var(--ai-soft); color: var(--ai); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; overflow-wrap: anywhere; }
.row .h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.row .t { font-weight: 600; } .row .s { color: var(--muted); font-size: 13px; }
details.row > summary { list-style: none; cursor: pointer; }
details.row > summary::-webkit-details-marker { display: none; }
details.row > summary .t::after { content: " ▾"; color: var(--muted); font-weight: 400; font-size: 12px; }
details.row[open] > summary .t::after { content: " ▴"; }
details.row:hover { border-color: var(--accent); }
.quote { border-left: 3px solid var(--user); background: var(--user-soft); padding: 4px 10px; border-radius: 0 8px 8px 0; margin-top: 6px; }
.empty { color: var(--muted); padding: 18px; text-align: center; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
.tbl { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--soft); color: var(--muted); font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
code { font-family: var(--mono); font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.doc h1 { font-size: 20px; margin-top: 0; } .doc h2 { font-size: 17px; } .doc h3 { font-size: 15px; }
.doc blockquote, .doc .note { color: var(--muted); border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
select { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.when { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
ul.cols { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--line); }
ul.cols li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
ul.cols li:last-child { border-bottom: 0; }
ul.cols .n { font-weight: 600; min-width: 6em; } ul.cols .d { color: var(--muted); font-size: 14px; }
footer.wrap { color: var(--muted); font-size: 12px; padding-bottom: 32px; overflow-wrap: anywhere; }
/* 한눈에 -- 기능 → 파일 → 표 그림 */
.dia { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; }
.dia svg { display: block; font-family: var(--sans); }
.dia .col { fill: var(--muted); font-size: 12px; font-weight: 600; }
.dia .nd rect { fill: var(--soft); stroke: var(--line); }
.dia .nd.f rect { fill: var(--panel); stroke: var(--accent); }
.dia .nd.sh rect { stroke-dasharray: 4 3; }
.dia .nd.t rect { fill: var(--ai-soft); stroke: var(--ai); }
.dia .nd.miss rect { stroke: var(--bad); }
.dia .nd text { fill: var(--ink); font-size: 13px; }
.dia .nd text.s { fill: var(--muted); font-size: 11px; }
.dia path { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 1.3; }
.dia path.t { stroke: var(--ai); }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1 id="title"></h1><span class="meta" id="meta"></span>
    <button class="theme" id="theme" type="button" aria-label="화면 밝기 바꾸기">밝기</button></div>
  <nav id="nav" aria-label="기록 메뉴"></nav>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent), N = D.notes;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function pill(t, c) { return '<span class="pill ' + (c || "") + '">' + esc(t) + "</span>"; }
  function empty(s) { return '<div class="empty">' + esc(s) + "</div>"; }
  function stripComments(s) { return String(s || "").replace(/<!--[\s\S]*?-->/g, ""); }

  $("title").textContent = D.project;
  $("meta").textContent = "만든 시각 " + D.generated_at.slice(0, 16).replace("T", " ");
  $("foot").textContent = "이 페이지는 " + D.folder + " 의 dev-notes 기록과 저장 목록으로 만든 파일입니다. 내 컴퓨터에서만 열립니다. 저장할 때마다 새로 만들어집니다.";
  var root = document.documentElement;
  try { var th = localStorage.getItem("light-portal-theme"); if (th) root.setAttribute("data-theme", th); } catch (e) {}
  $("theme").onclick = function () {
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
    try { localStorage.setItem("light-portal-theme", root.getAttribute("data-theme")); } catch (e) {}
  };

  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s.replace(/\[([^\]]+)\]\((https?:[^)\s]+|[^):\s]+)\)/g, '<a href="$2">$1</a>');   // javascript: 같은 주소는 링크로 만들지 않는다
  }
  function md(src) {
    var lines = stripComments(src).replace(/\r/g, "").split("\n"), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { var b = []; i++; while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++; out.push("<pre>" + esc(b.join("\n")) + "</pre>"); continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(l);
      if (h) { var n = h[1].length; out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">"); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var cells = function (r) { return r.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); };
        var head = cells(l), rows = []; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push('<div class="tbl"><table><thead><tr>' + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>");
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "").replace(/^\[ \]\s*/, "☐ ").replace(/^\[x\]\s*/i, "☑ "));
        out.push("<ul>" + items.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</ul>"); continue;
      }
      if (/^>\s?/.test(l)) { var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, "")); out.push('<div class="note">' + inline(q.join(" ")) + "</div>"); continue; }
      if (!l.trim()) { i++; continue; }
      var p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s|>|\s*\|)/.test(lines[i])) p.push(lines[i++]);
      if (!p.length) p.push(lines[i++]);
      out.push("<p>" + inline(p.join(" ")) + "</p>");
    }
    return out.join("\n");
  }
  function doc(name, hint) { return N[name] ? '<div class="card doc">' + md(N[name]) + "</div>" : empty(hint); }

  // "- 날짜 시각 · 단계 · 무엇을 · 결과 · 누가"
  function logRows(text) {
    var rows = [];
    stripComments(text).split("\n").forEach(function (l) {
      var m = /^-\s+(\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{2})?)\s+·\s+(.+)$/.exec(l.trim());
      if (!m) return;
      var p = m[2].split(/\s+·\s+/);
      // 새 형식: 단계 · 기능 · 무엇을 · 결과 · 누가 / 예전(0.6.0): 단계 · 무엇을 · 결과 · 누가
      var r = p.length >= 5 ? { step: p[0], feature: p[1], what: p[2], result: p[3], who: p[4] }
                            : { step: p[0] || "", feature: "", what: p[1] || "", result: p[2] || "", who: p[3] || "" };
      r.when = m[1];
      rows.push(r);
    });
    return rows;
  }
  // "- 날짜 [사용자] 무엇 -- "원문"" / "- 날짜 [AI] 무엇 -- 이유 (다른 안: …)" / 예전 형식 "- 날짜: 무엇 -- 이유"
  function decisionRows(text) {
    var rows = [];
    stripComments(text).split("\n").forEach(function (l) {
      var m = /^-\s+(\d{4}-\d{2}-\d{2}):?\s+(?:\[(사용자|AI)\]\s+)?(.+)$/.exec(l.trim());
      if (!m) return;
      var body = m[3], i = body.indexOf(" -- ");
      rows.push({ when: m[1], who: m[2] || "", what: i >= 0 ? body.slice(0, i) : body, why: i >= 0 ? body.slice(i + 4) : "" });
    });
    return rows;
  }
  var FLOG = {}; (D.feature_logs || []).forEach(function (x) { FLOG[x.feature + "/" + x.date] = x; });
  D.feature_logs = D.feature_logs || [];
  function folder(name) { return String(name).trim().replace(/\s+/g, "-"); }
  var STEPC = { "기획": "ai", "만들기": "", "확인": "warn", "운영": "", "평가": "user" };
  function resultPill(r) { return r ? pill(r, /실패|안 됨|문제|오류/.test(r) ? "bad" : /못|기다|대기|중/.test(r) ? "warn" : /완료|통과|확인|저장|해결|ok/i.test(r) ? "ok" : "") : ""; }
  function whoPill(w) { return w ? pill(w, /사용자|나/.test(w) ? "user" : "ai") : ""; }

  // 데이터 (짝 스킬 data-light 의 정본 data/model.light.json -- 구조만)
  var TYPE = { id: "자동 번호", ref: "다른 표를 가리킴", text: "짧은 글", long_text: "긴 글", int: "정수", number: "숫자",
               money: "금액", bool: "예/아니오", date: "날짜", datetime: "날짜+시각", owner: "만든 사람 (로그인 계정)" };
  var ACCESS = { members: "로그인한 사람 모두", own: "만든 사람만", read: "누구나 읽기만" };
  var word = function (map, k) { return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : String(k); };
  var accessWord = function (a) {   // 한 값 또는 [읽기, 쓰기] 두 개 목록 (게시판 ["read", "own"])
    if (!Array.isArray(a)) return word(ACCESS, a);
    return a.length === 2 ? "읽기 " + word({ read: "누구나", members: "로그인한 사람 모두", own: "만든 사람만" }, a[0]) +
      " · 쓰기 " + word({ read: "누구나", members: "로그인한 사람 모두", own: "만든 사람만" }, a[1]) : a.map(function (x) { return word(ACCESS, x); }).join(" · ");
  };
  var KIND = { design: "설계까지", load: "파일 넣기", manage: "데이터 관리", analyze: "분석" };
  var SIGNUP = { closed: "새 가입을 끈 사이트 (정해진 사람끼리) -- Supabase 의 새 가입·익명 로그인이 실제로 꺼져 있어야 합니다",
                 open: "누구나 가입하는 사이트" };
  var DEL = { keep: "가리키는 행이 있으면 못 지움", "delete": "같이 지워짐", clear: "비워짐" };
  var PI = { name: "이름", phone: "전화번호", email: "이메일", address: "주소", birth: "생년월일", id_number: "고유번호",
             account: "계좌", health: "건강", photo: "사진", location: "위치", other: "기타" };
  function usedBy() {     // FEATURES.md 의 "## 데이터 (표)" 절: | 표 | 이름표 | 쓰는 기능 |
    var m = /\n##\s*데이터[^\n]*\n([\s\S]*?)(?=\n##\s|$)/.exec("\n" + stripComments(N.FEATURES || "")), out = Object.create(null);
    if (!m) return out;
    m[1].split("\n").forEach(function (l) {
      if (!/^\s*\|/.test(l) || /^\s*\|[\s:|-]+\|\s*$/.test(l) || /\(예\)/.test(l)) return;
      var c = l.trim().replace(/^\||\|$/g, "").split("|").map(function (x) { return x.trim(); });
      if (c[0] && c[0] !== "표" && c.length >= 3) out[c[0].replace(/`/g, "")] = c[2];
    });
    return out;
  }
  function cut(s, n) { s = String(s == null ? "" : s); var w = 0, out = ""; for (var i = 0; i < s.length; i++) { var ch = s.charAt(i);
    w += /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(ch) ? 1 : 0.55; if (w > n) return out + "…"; out += ch; } return out; }
  function mapView() {      // 내 시스템 한눈에 -- 기능 지도(FEATURES.md) · 데이터 정본 · 프로젝트 파일에서 (AI 가 그린 그림이 아니다)
    var M = D.map || {}, h = "";
    var feats = M.features || [], parts = M.parts || [], tl = M.tools || [], tabs = M.tables || [];
    h += '<p class="s">문제가 생기면 코드 전체를 훑지 않고 여기서 고칠 곳부터 찾습니다 -- 기능 → 쓰는 파일 → 표. AI 는 ' +
      "<code>python .claude/skills/light-portal/portal_tool.py where \"오류 글·화면 이름\"</code> 로 같은 것을 찾습니다.</p>";
    if (!feats.length && (M.works || []).length) {      // 기능이 아직 없으면 데이터 설계의 하는 일 → 표
      var W2 = 230, G2 = 90, H2 = 34, V2 = 10, tl2 = [], tix = {};
      M.works.forEach(function (w) { w.uses.forEach(function (t) { if (!(t in tix)) { tix[t] = tl2.length; tl2.push(t); } }); });
      var y2 = function (i) { return 34 + i * (H2 + V2); }, hg = 44 + Math.max(M.works.length, tl2.length) * (H2 + V2);
      var lab = {}; (D.data && D.data.tables || []).forEach(function (t) { lab[t.name] = t.label; });
      var sv = '<svg width="' + (16 + 2 * W2 + G2 + 16) + '" height="' + hg + '" role="img" aria-label="하는 일 → 표"><text class="col" x="16" y="20">하는 일 (데이터 설계)</text>' +
        '<text class="col" x="' + (16 + W2 + G2) + '" y="20">표</text>';
      M.works.forEach(function (w, i) { w.uses.forEach(function (t) { var x1 = 16 + W2, x2 = 16 + W2 + G2, a = y2(i) + H2 / 2, b = y2(tix[t]) + H2 / 2, m = (x1 + x2) / 2;
        sv += '<path class="t" d="M' + x1 + "," + a + " C" + m + "," + a + " " + m + "," + b + " " + x2 + "," + b + '"/>'; }); });
      M.works.forEach(function (w, i) { sv += '<g class="nd f"><rect x="16" y="' + y2(i) + '" width="' + W2 + '" height="' + H2 + '" rx="8"/><text x="26" y="' + (y2(i) + 21) + '">' + esc(cut(w.name, 19)) + "</text></g>"; });

          var items = (x.text.split("## 자세히")[0].match(/^- #\d+.*$/gm) || []).length;
          return '<details class="row"><summary><div class="h"><span class="t">' + esc(x.date) + '</span><span class="s">목록 ' + items + "줄</span></div></summary>" +
            '<div class="doc" style="margin-top:8px">' + md(x.text) + "</div></details>";
        }).join("") + "</div>";
      }).join("");
    }],
    saves: ["저장", function () {
      if (!D.saves.length) return empty("아직 저장이 없습니다 (git)");
      return '<p class="s" style="color:var(--muted)">되돌아올 수 있는 지점입니다. 되돌리려면 AI 에게 "○○ 때로 되돌려 줘"라고 말하세요 (light-undo).' +
        (D.remote ? "" : " 인터넷 저장소는 연결되어 있지 않습니다.") + '</p><div class="list">' + D.saves.map(function (s) {
        var c = { "기능": "ok", "수정": "ok", "데이터": "ai", "되돌리기": "warn", "중간 저장": "" }[s.kind];
        return '<div class="row"><div class="h">' + (s.kind ? pill(s.kind, c || "") : "") + '<span class="t">' + esc(s.kind ? s.msg.slice(s.kind.length + 1).trim() : s.msg) + "</span>" +
          '<span class="when">' + esc(s.at.slice(0, 16).replace("T", " ")) + " · " + esc(s.hash) + "</span></div></div>";
      }).join("") + "</div>";
    }],
    names: ["이름표", function () { return doc("NAMES", "NAMES.md 가 없습니다"); }]
  };
  if (N.LEARNED) VIEWS.learned = ["배운 것", function () { return doc("LEARNED", ""); }];
  if (!D.data) delete VIEWS.data;

  $("nav").innerHTML = Object.keys(VIEWS).map(function (k) { return '<a href="#' + k + '" data-v="' + k + '">' + VIEWS[k][0] + "</a>"; }).join("") +
    (D.manual ? '<a href="' + esc(D.manual) + '" target="_blank" rel="noopener">사용설명서 ↗</a>' : "");

  function render() {
    var v = location.hash.slice(1); if (!VIEWS[v]) v = "now";
    try { $("main").innerHTML = VIEWS[v][1](); }
    catch (e) { $("main").innerHTML = empty("이 메뉴를 그리지 못했습니다 (" + (e && e.message) + ") -- 기록 파일을 직접 열어 보세요"); }
    Array.prototype.forEach.call(document.querySelectorAll("nav a[data-v]"), function (a) {
      if (a.getAttribute("data-v") === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-dec]"), function (b) { b.onclick = function () { VIEWS.decisions.f = b.getAttribute("data-dec"); render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-step]"), function (b) { b.onclick = function () { VIEWS.log.f = b.getAttribute("data-step"); render(); }; });
    var lf = document.getElementById("lfeat"); if (lf) lf.onchange = function () { VIEWS.log.ff = lf.value; render(); };
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
