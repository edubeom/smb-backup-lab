<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERD 보기</title>
<style nonce="__NONCE__">
:root{
  --font:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","D2Coding","Consolas",monospace;
}
/* 다섯 가지 테마 -- 화면 틀(--ui-*)과 그림(--*) 을 함께 바꾼다 */
.t-paper{--bg:#E8ECF0;--dot:#C9D1D9;--ui:#F7F9FA;--ui-line:#D3DAE1;--ink:#1C2632;--mute:#627285;--plate:#FFFFFF;--plate-line:#B9C3CD;--head:#F2F5F7;
  --rel:#6F7F90;--hl:#0B7A75;--sel:#0B7A75;--frame:#FFFFFF66;--frame-line:#AEB8C2;--k-code:#9A7B2F;--k-base:#3B6A99;--k-tx:#2D7D52;--k-hist:#76589A;--k-pi:#B3383B;--k-con:#B0602A;--k-log:#4E6E8E;--bad:#B3383B}
.t-night{--bg:#1F2835;--dot:#2E3A4A;--ui:#252F3D;--ui-line:#36445A;--ink:#E2E8F0;--mute:#93A3B8;--plate:#2B3646;--plate-line:#43536A;--head:#323F51;
  --rel:#8798AD;--hl:#F0B84A;--sel:#F0B84A;--frame:#ffffff08;--frame-line:#3E4C61;--k-code:#D6B25E;--k-base:#6FA3D8;--k-tx:#62C08B;--k-hist:#B597DB;--k-pi:#F07A7D;--k-con:#E99A63;--k-log:#8FB0D0;--bad:#F07A7D}
.t-blue{--bg:#1A4C84;--dot:#2B629E;--ui:#173F6C;--ui-line:#2F619A;--ink:#EEF5FF;--mute:#A9C4E4;--plate:#1D5592;--plate-line:#CFE0F5;--head:#22609F;
  --rel:#CFE0F5;--hl:#FFD45C;--sel:#FFD45C;--frame:#ffffff0a;--frame-line:#8FB3DC;--k-code:#FFE08A;--k-base:#BFE0FF;--k-tx:#A8F0C6;--k-hist:#E2C8FF;--k-pi:#FFB0A8;--k-con:#FFC89A;--k-log:#D5E6FA;--bad:#FFB0A8}
.t-pastel{--bg:#F3F0F8;--dot:#E0D9EC;--ui:#FBFAFD;--ui-line:#E2DCEC;--ink:#2E2840;--mute:#7A7190;--plate:#FFFFFF;--plate-line:#D6CDE6;--head:#F7F4FB;
  --rel:#9A8FB3;--hl:#7C4DDB;--sel:#7C4DDB;--frame:#ffffff80;--frame-line:#D3C9E5;--k-code:#E0B354;--k-base:#7FA9E0;--k-tx:#6CC49A;--k-hist:#B892E6;--k-pi:#EE8A97;--k-con:#E79A6C;--k-log:#8AA4C8;--bad:#C2414F}
.t-contrast{--bg:#FFFFFF;--dot:#FFFFFF;--ui:#FFFFFF;--ui-line:#000000;--ink:#000000;--mute:#2B2B2B;--plate:#FFFFFF;--plate-line:#000000;--head:#FFFFFF;
  --rel:#000000;--hl:#0040E0;--sel:#0040E0;--frame:#ffffff00;--frame-line:#000000;--k-code:#7A5A00;--k-base:#003C8F;--k-tx:#005C2E;--k-hist:#56208F;--k-pi:#B00000;--k-con:#8A3A00;--k-log:#00336B;--bad:#B00000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--font);color:var(--ink);background:var(--bg);display:grid;grid-template-rows:auto 1fr;grid-template-columns:270px 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:var(--ui);border-bottom:1px solid var(--ui-line)}
header h1{font-size:15px;font-weight:700;margin:0 6px 0 0;letter-spacing:-.01em;white-space:nowrap}
header h1 small{font-weight:400;color:var(--mute);margin-left:6px}
.tabs{display:inline-flex;gap:2px;border-bottom:2px solid var(--ui-line)}
.tabs[hidden],#stage-info[hidden]{display:none}
.tabs button{border:0;background:transparent;padding:4px 12px 5px;cursor:pointer;color:var(--mute);margin-bottom:-2px;border-bottom:2px solid transparent;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hl)}
#stage-info{font-size:12px;color:var(--mute);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage-info b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;border-right:1px solid var(--ui-line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ui)}
.seg button:disabled{opacity:.4;cursor:default}
.grp{display:inline-flex;align-items:center;gap:6px}
.grp>span{color:var(--mute);font-size:12px}
.btn{border:1px solid var(--ui-line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.due{background:var(--hl);border-color:var(--hl);color:var(--ui)}
select{border:1px solid var(--ui-line);background:var(--ui);border-radius:6px;padding:3px 6px}
.spacer{flex:1}
aside{background:var(--ui);border-right:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:0}
aside .find{padding:10px 12px;border-bottom:1px solid var(--ui-line)}
aside input[type=search]{width:100%;border:1px solid var(--ui-line);border-radius:6px;padding:5px 8px;background:var(--plate)}
aside .pick{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--mute)}
aside .pick .seg button{padding:2px 8px;font-size:12px}
#list{overflow:auto;flex:1;padding:4px 0 16px}
.src{padding:10px 12px 2px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.src em{font-style:normal;font-weight:400;color:var(--mute);flex:none}
.msg{margin:2px 12px 6px;padding:6px 8px;border-left:3px solid var(--bad);font-size:12px;color:var(--ink);background:var(--plate)}
.msg.warn{border-left-color:var(--k-code)}
.msg.info{border-left-color:var(--mute)}
.sch{padding:6px 12px 2px 18px;color:var(--mute);font-size:12px}
.item{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:3px 12px 3px 18px;cursor:pointer}
.item:hover{background:var(--head)}
.item i{width:4px;height:14px;border-radius:1px;flex:none}
.item b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);margin-left:auto;font-size:11px;white-space:nowrap}
.item[aria-pressed=true]{background:var(--head);box-shadow:inset 3px 0 0 var(--sel)}
.item[aria-pressed=true] b{font-weight:700}
.item.hide{display:none}
main{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
svg#c{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#c.panning{cursor:grabbing}
#status{position:absolute;left:12px;bottom:10px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);background:var(--ui);border:1px solid var(--ui-line);border-radius:6px;padding:3px 9px;max-width:calc(100% - 24px)}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--k-tx);flex:none}
#status.off .dot{background:var(--mute)}
#status.bad .dot{background:var(--bad)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ui);padding:5px 8px;border-radius:5px;font-size:12px;display:none;max-width:340px;z-index:3}
#empty{position:absolute;inset:0;display:none;place-content:center;text-align:center;color:var(--mute);padding:20px}
#empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
#empty span{display:block;max-width:460px}
/* 상세 패널 -- 설명·의미·단계 간 이동 */
#detail{position:absolute;top:10px;right:10px;bottom:46px;width:340px;max-width:calc(100% - 20px);background:var(--ui);border:1px solid var(--ui-line);border-radius:8px;
  display:none;flex-direction:column;z-index:2;box-shadow:0 2px 10px #0002}
#detail.on{display:flex}
#detail header{grid-column:auto;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ui-line)}
#detail h2{font-size:14px;margin:0;flex:1;line-height:1.35}
#detail h2 small{display:block;font-weight:400;color:var(--mute);font-size:12px}
#detail .body{overflow:auto;padding:8px 12px 14px;flex:1}
#detail p{margin:4px 0 8px;white-space:pre-line}
#detail dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
#detail dt{color:var(--mute)}
#detail dd{margin:0;white-space:pre-line}
#detail h3{font-size:12px;margin:12px 0 4px;color:var(--mute);font-weight:600}
#detail .col{border-top:1px solid var(--ui-line);padding:6px 0}
#detail .col b{font-weight:600}
#detail .col code{font:11px var(--mono);color:var(--mute)}
#detail .go{display:inline-block;border:1px solid var(--ui-line);background:var(--plate);border-radius:5px;padding:1px 7px;margin:2px 4px 2px 0;cursor:pointer;font-size:12px}
#detail .go:hover{border-color:var(--hl)}
#detail .none{color:var(--mute);font-style:italic}
#detail .term{font-size:12px;border-left:2px solid var(--ui-line);padding-left:8px;margin:4px 0}
/* 그림 */
.frame rect{fill:var(--frame);stroke:var(--frame-line);stroke-dasharray:6 4}
.frame text{fill:var(--mute);font:600 12px var(--font)}
.frame text tspan.s{font-weight:400}
.ent{cursor:pointer}
.ent .plate{fill:var(--plate);stroke:var(--plate-line);stroke-width:1}
.ent .head{fill:var(--head)}
.ent .tab{fill:var(--kc)}
.ent .sep{stroke:var(--plate-line)}
.ent .nm{fill:var(--ink);font:700 13px var(--font)}
.ent .ph{fill:var(--mute);font:400 11px var(--font)}
.ent .cn{fill:var(--ink);font:400 12px var(--font)}
.ent .cn.nn{font-weight:600}
.ent .ct{fill:var(--mute);font:400 11px var(--mono)}
.ent .ck{fill:var(--kc);font:700 9.5px var(--font);letter-spacing:.02em}
.ent .cpi{fill:var(--k-pi);font:700 9.5px var(--font)}
.ent .pin{fill:var(--mute);font:700 9.5px var(--font)}
.ent .more{fill:var(--mute);font:italic 11px var(--font)}
.ent.sel .plate{stroke:var(--sel);stroke-width:2.2}
.ent.match .plate{stroke:var(--hl);stroke-dasharray:3 2}
.k-코드{--kc:var(--k-code)}.k-기준{--kc:var(--k-base)}.k-거래{--kc:var(--k-tx)}.k-이력{--kc:var(--k-hist)}.k-PI{--kc:var(--k-pi)}.k-개념{--kc:var(--k-con)}.k-논리{--kc:var(--k-log)}
.rel path{fill:none;stroke:var(--rel);stroke-width:1.3}
.rel .hit{stroke:transparent;stroke-width:12;cursor:help}
.rel circle{fill:var(--plate);stroke:var(--rel);stroke-width:1.3}
.rel .rl{fill:var(--mute);font:400 11px var(--font);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
/* 관계선 (IE 표기): 식별 = 실선, 비식별 = 점선, 코드 참조 = 짧은 점선·흐린 색. 있어야/없어도 되는지는 끝 표시(| · ○) */
.rel.nid .line{stroke-dasharray:6 4}
.rel.code path:not(.hit){stroke:var(--mute)}.rel.code .line{stroke-dasharray:2 3}.rel.code circle{stroke:var(--mute)}
aside .rk{margin-top:8px;font-size:12px;color:var(--mute)}
aside .rk .row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
aside .rk button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ui-line);background:transparent;border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;color:var(--ink)}
aside .rk button[aria-pressed=false]{color:var(--mute);text-decoration:line-through;opacity:.7}
aside .rk button:disabled{opacity:.4;cursor:default;text-decoration:none}
aside .rk button em{font-style:normal;color:var(--mute)}
aside .rk svg{width:26px;height:8px;flex:none}
aside .rk svg path{fill:none;stroke:var(--rel);stroke-width:1.5}
aside .rk .code svg path{stroke:var(--mute);stroke-dasharray:2 3}
aside .rk .nid svg path{stroke-dasharray:6 4}
#status-rel:empty{display:none}
#status-rel{border-left:1px solid var(--ui-line);padding-left:8px}
.focus .ent{opacity:.28}.focus .rel{opacity:.12}
.focus .ent.on,.focus .rel.on{opacity:1}
.rel.on path:not(.hit),.rel.on circle{stroke:var(--hl);stroke-width:2}
.rel.flow .line{stroke:var(--sel);stroke-width:2;stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.t-contrast .rel path{stroke-width:1.6}.t-contrast .ent .plate{stroke-width:1.4}
@media (prefers-reduced-motion:reduce){.rel.flow .line{animation:none}}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:32vh;border-right:0;border-bottom:1px solid var(--ui-line)}header{grid-column:1}#detail{width:auto;left:10px}}
</style>
<script nonce="__NONCE__" src="__BASE__/erdlayout.js"></script>
</head>
<body class="t-paper" data-layout="idle">
<header>
  <h1 id="title">ERD 보기<small id="sub"></small></h1>
  <div class="tabs" id="stages" role="tablist" aria-label="모델 단계">
    <button role="tab" data-v="concept" aria-selected="false">개념 모델</button><button role="tab" data-v="logical" aria-selected="false">논리 모델</button><button role="tab" data-v="physical" aria-selected="true">물리 모델</button></div>
  <span id="stage-info" aria-live="polite"></span>
  <div class="grp"><span id="lvl-l">보기</span><div class="seg" id="level" role="group" aria-labelledby="lvl-l">
    <button data-v="1" title="엔터티 이름만 (1)">엔터티</button><button data-v="2" title="키 컬럼 (2)">키</button><button data-v="3" title="모든 컬럼 (3)">컬럼</button><button data-v="4" title="컬럼과 자료형 (4)">타입</button></div></div>
  <div class="grp"><span id="nm-l">이름</span><div class="seg" id="names" role="group" aria-labelledby="nm-l">
    <button data-v="kor">논리</button><button data-v="phys">물리</button><button data-v="both">둘 다</button></div></div>
  <div class="grp"><label for="theme"><span>테마</span></label><select id="theme">
    <option value="paper">종이</option><option value="night">밤</option><option value="blue">청사진</option><option value="pastel">파스텔</option><option value="contrast">고대비</option></select></div>
  <span class="spacer"></span>
  <div class="grp"><label><input type="checkbox" id="live"> 실시간</label><button class="btn" id="apply" title="원본을 다시 읽어 그린다">적용</button></div>
  <button class="btn" id="fit" title="화면에 맞추기 (0)">맞추기</button>
  <div class="grp"><button class="btn" id="relayout" title="보이는 엔터티를 지금 그려진 관계선(켠 종류)에 따라 다시 배치 (고정한 것은 그대로)">자동 배치</button>
    <button class="btn" id="pin" title="선택한 엔터티를 고정 -- 자동 배치가 옮기지 않는다">고정</button>
    <button class="btn" id="undo" title="자동 배치·초기화 전 위치로">되돌리기</button>
    <button class="btn" id="reset" title="고정을 풀고 이 단계 전체를 처음부터 배치 (두 번 눌러야 한다)">초기화</button>
    <label title="옮긴 위치를 이 브라우저에만 둔다 (공유 위치 파일은 그대로)"><input type="checkbox" id="mine"> 내 화면에만</label></div>
  <div class="grp"><span>내보내기</span><button class="btn" id="svg">SVG</button><button class="btn" id="png">PNG</button></div>
</header>
<aside>
  <div class="find">
    <input type="search" id="q" placeholder="찾기 -- 한글·물리 이름, 별칭, 설명, 원천 열" aria-label="찾기">
    <div class="pick"><div class="seg" id="view" role="group" aria-label="보이는 엔터티">
      <button data-v="all">전체</button><button data-v="sel">선택만</button><button data-v="near">이웃까지</button></div>
      <button class="btn" id="clear" title="선택 해제 (Esc)">해제</button></div>
    <div class="rk" id="relkinds" role="group" aria-label="관계선 종류"><span id="rk-l" title="끈 종류는 그리지 않고, 이웃 보기·자동 배치도 켠 선만 본다">관계선 종류</span><div class="row"></div></div>
  </div>
  <div id="list" role="list"></div>
</aside>
<main>
  <svg id="c" xmlns="http://www.w3.org/2000/svg" aria-label="ERD"><g id="world"><g id="frames"></g><g id="rels"></g><g id="ents"></g></g></svg>
  <div id="tip" role="tooltip"></div>
  <div id="empty"><div><b id="empty-h"></b><span id="empty-t"></span></div></div>
  <section id="detail" aria-label="상세"><header><h2 id="d-title"></h2><button class="btn" id="d-close" title="닫기">닫기</button></header><div class="body" id="d-body"></div></section>
  <div id="status" aria-live="polite"><span class="dot"></span><span id="status-t">읽는 중</span><span id="status-rel"></span></div>
</main>
<script nonce="__NONCE__">
"use strict";
const CFG = __CONFIG__;
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
const store = {get(k, d) { try { const v = localStorage.getItem("dataviewer." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("dataviewer." + k, JSON.stringify(v)); } catch (e) {} }};
const STAGES = ["concept", "logical", "physical"];
const STAGE_KO = {concept: "개념 모델", logical: "논리 모델", physical: "물리 모델"};
const MEANING = {grain: "한 행", scope: "범위", source_kind: "구분", history: "변경·이력", split_reason: "분리 이유", tech_reason: "도입 이유",
                 unit: "단위", value_rule: "값 규칙", null_meaning: "비어 있으면", time_zone: "시간대", code_set: "코드 집합", key_kind: "식별",
                 source: "원천", derivation: "계산·변환", protection: "보호"};
const S = {model: null, level: store.get("level", 3), names: store.get("names", "both"), theme: store.get("theme", "paper"),
           stage: STAGES.includes(store.get("stage", "physical")) ? store.get("stage", "physical") : "physical",
           mine: !!CFG.save && store.get("mine", false),
           live: CFG.live, view: "all", sel: new Set(), size: new Map(), q: "",
           z: 1, px: 40, py: 40, pending: false, fitted: {}, hover: null, placed: new Set(), off: new Map(),
           posBy: {concept: new Map(), logical: new Map(), physical: new Map()},
           pins: {concept: new Set(), logical: new Set(), physical: new Set()},
           prev: {concept: null, logical: null, physical: null}, lastLayout: null,
           touched: {concept: new Set(), logical: new Set(), physical: new Set()}, refit: {},
           relOff: {logical: new Set(store.get("relOff.logical", [])), physical: new Set(store.get("relOff.physical", []))}};
Object.defineProperty(S, "pos", {get() { return S.posBy[S.stage]; }});
const LAYOUT = {head1: 30, head2: 42, row: 18, pad: 6, minW: 150, gapX: 70, gapY: 36};
const measure = document.createElement("canvas").getContext("2d");
function textW(t, font) { measure.font = font; return measure.measureText(t || "").width; }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function txt(parent, x, y, cls, s) { const t = el("text", {x, y, class: cls}, parent); t.textContent = s; return t; }
function h(tag, cls, text, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
const gid = (src, key) => src.id + "|" + key;
const PHYS = () => S.stage === "physical";

/* ---------------------------------------------------------------- 자료 -- 단계(개념·논리·물리)마다 같은 모양으로 */
function levelOf(s, stage) { return stage === "physical" ? null : ((s.levels || {})[stage] || null); }

/* ---------------------------------------------------------------- 서버 · 위치 저장 (공유 위치 파일 / 내 화면에만 / 이 화면에서만) */
function api(path, opts) { return fetch(CFG.base + path, Object.assign({cache: "no-store", headers: {"X-Viewer-Token": CFG.token, "Content-Type": "application/json"}}, opts || {})); }
const mineKey = (sid, stage) => `mine.${sid}.${stage}`;
let saveTimer = 0;
const pending = new Map();         // "단계|원본" -> 보낼 내용 (부를 때 만든다 -- 그사이 탭을 바꿔도 다른 단계 값이 섞이지 않게)
const echo = new Map();            // 저장한 값 여러 개를 기억한다 -- 늦게 돌아온 앞선 저장(예: 자동 배치)이 그 뒤의 되돌리기를 덮지 않게
const ECHO_KEEP = 4;

function echoHas(k, j) { const a = echo.get(k); return !!a && a.includes(j); }            // "단계|엔터티" -> 이 화면이 저장한 위치 -- 다시 읽을 때 돌아온 자기 저장이 그 뒤 옮긴 위치를 덮지 않게
const lastSrv = {concept: new Map(), logical: new Map()};   // 서버에서 마지막으로 받은 개념·논리 위치 (다른 사람이 바꾼 것만 따른다)
const pj = (p) => JSON.stringify({x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10});
function keysOf(s, stage) { const out = {}; for (const t of stageNodes(s, stage)) { const p = S.posBy[stage].get(gid(s, t.key)); if (p) out[t.key] = p; } return out; }

function saveLayout(srcIds, extra) {
  const stage = S.stage;
  render();
  if (!CFG.save) { status("위치는 이 화면에서만 바뀐다 (이 서버는 저장하지 않는다)", "off"); return; }
  const srcs = [...srcIds].map(sid => S.model.sources.find(x => x.id === sid)).filter(Boolean);
  if (S.mine) { for (const s of srcs) store.set(mineKey(s.id, stage), {positions: keysOf(s, stage), pinned: pinsOf(s, stage)});
    status("위치를 이 브라우저에만 저장했다 (공유 위치 파일은 그대로)"); return; }
  for (const s of srcs) {

    if (extra && extra.previous) { body.previous = {}; for (const t of stageNodes(s, stage)) { const p = extra.previous.get(gid(s, t.key)); if (p) body.previous[t.key] = p; } }
    else if (before.previous) body.previous = before.previous;
    if (extra && extra.algo) body.algo = extra.algo; else if (before.algo) body.algo = before.algo;
    for (const [k, p] of Object.entries(body.positions)) echoAdd(stage + "|" + gid(s, k), pj(p));

async function flushSaves() {
  clearTimeout(saveTimer);

  for (const body of todo) {
    try { const r = await api("/api/layout", {method: "POST", body: JSON.stringify(body)}); const j = await r.json();
      status(r.ok ? `위치를 ${j.file} 에 저장했다 (${STAGE_KO[body.stage]})` : `위치를 저장하지 못했다: ${j.error || j.detail || r.status}`, r.ok ? "" : "bad"); }
    catch (e) { status("위치를 저장하지 못했다: 서버에 닿지 않는다", "bad"); }
  }
}
function applySaved(m, fresh) {   // 서버의 단계별 위치·고정 + (내 화면에만이면) 이 브라우저의 위치
  for (const s of m.sources) {
    const lay = s.layout || {};
    for (const st of STAGES) {
      const L = lay[st] || {positions: {}, pinned: []}, mine = S.mine ? store.get(mineKey(s.id, st), null) : null;
      if (st !== "physical") for (const [k, p] of Object.entries(L.positions || {})) {
        const id = gid(s, k), j = pj(p);
        if (fresh || !S.posBy[st].has(id) || (lastSrv[st].get(id) !== j && !echoHas(st + "|" + id, j))) S.posBy[st].set(id, {x: p.x, y: p.y});
        lastSrv[st].set(id, j);
      }
      if (mine) for (const [k, p] of Object.entries(mine.positions || {})) S.posBy[st].set(gid(s, k), {x: p.x, y: p.y});
      if (!pending.has(st + "|" + s.id)) {          // 고정은 서버(또는 내 브라우저)의 것으로 바꾼다 -- 다른 사람이 푼 고정도 따른다

async function load(force) {

    const projects = [...new Set(m.sources.map(s => s.project))];

           `원본 ${m.sources.length}개 · 엔터티 ${n}개${fresh ? "" : " · 다시 읽었다"}`, bad.length ? "bad" : "");

  await flushSaves();             // 바꾸기 전 공유 저장은 마저 보내고
  S.mine = e.target.checked; store.set("mine", S.mine); resetLocal();
  await load(false); status(S.mine ? "옮긴 위치를 이 브라우저에만 둔다" : "옮긴 위치를 공유 위치 파일에 둔다"); });
$("#apply").addEventListener("click", () => load(true));
$("#fit").addEventListener("click", () => fit());
$("#clear").addEventListener("click", () => { S.sel.clear(); S.view = "all"; syncSel(); });
function armed(btn, label, fn) {   // 두 번 눌러야 하는 단추
  let t = 0;
  btn.addEventListener("click", () => {
    if (!t) { t = setTimeout(() => { t = 0; btn.textContent = label; }, 3000); btn.textContent = "한 번 더 누르면 " + label; return; }
    clearTimeout(t); t = 0; btn.textContent = label; fn();
  });
}
armed($("#relayout"), "자동 배치", () => { const vis = visibleIds(); autoLayout(vis.size < tables().length ? vis : null, false); });
armed($("#reset"), "초기화", () => { S.pins[S.stage].clear(); autoLayout(null, true); });
$("#pin").addEventListener("click", () => {
  const set = S.pins[S.stage], all = [...S.sel].every(id => set.has(id));
  for (const id of S.sel) { if (all) set.delete(id); else set.add(id); }
  saveLayout(new Set([...S.sel].map(id => id.split("|")[0]))); syncButtons();
});
$("#undo").addEventListener("click", () => {
  const p = S.prev[S.stage]; if (!p) return;
  const cur = new Map([...S.pos].map(([k, v]) => [k, {...v}]));
  for (const [id, v] of p) S.pos.set(id, {...v});
  S.prev[S.stage] = cur;
  saveLayout(new Set([...p.keys()].map(id => id.split("|")[0])), {previous: cur}); fit(); syncButtons(); status("직전 배치로 되돌렸다");
});
let qTimer = 0;
$("#q").addEventListener("input", (e) => { S.q = e.target.value; filterList(); clearTimeout(qTimer); qTimer = setTimeout(render, 120); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { const hits = [...document.querySelectorAll("#list .item:not(.hide)")].map(b => b.dataset.id);
  if (hits.length) { hits.forEach(id => S.sel.add(id)); syncSel(); fit(hits); } } });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,select")) return;
  if (e.key >= "1" && e.key <= "4") { S.level = +e.key; store.set("level", S.level); syncButtons(); render(); }
  else if (e.key === "0") fit();
  else if (e.key === "Escape") { S.sel.clear(); S.view = "all"; syncSel(); }
  else if (e.key === "+" || e.key === "=") { S.z = Math.min(3, S.z * 1.2); applyView(); }
  else if (e.key === "-") { S.z = Math.max(0.1, S.z / 1.2); applyView(); }
});
window.addEventListener("resize", () => applyView());

/* ---------------------------------------------------------------- 내보내기 */
const VARS = ["--bg","--ink","--mute","--plate","--plate-line","--head","--rel","--hl","--sel","--frame","--frame-line","--k-code","--k-base","--k-tx","--k-hist","--k-pi","--k-con","--k-log","--font","--mono"];
function exportSvg() {
  const src = $("#c"), ids = [...visibleIds()], b = bbox(ids), m = 50;
  const out = src.cloneNode(true);
  out.removeAttribute("class"); out.removeAttribute("id");
  const w = Math.ceil(b.x2 - b.x1 + m * 2), hh = Math.ceil(b.y2 - b.y1 + m * 2 + 40);
  out.setAttribute("width", w); out.setAttribute("height", hh); out.setAttribute("viewBox", `${b.x1 - m} ${b.y1 - m - 40} ${w} ${hh}`);
  out.querySelector("#world").removeAttribute("transform");
  out.querySelectorAll(".hit").forEach(n => n.remove());
  out.querySelectorAll(".flow,.on,.match").forEach(n => n.classList.remove("flow", "on", "match"));
  const cs = getComputedStyle(document.body);
  let css = ":root{" + VARS.map(v => `${v}:${cs.getPropertyValue(v)}`).join(";") + "}";
  for (const sh of document.styleSheets) for (const rule of sh.cssRules) if (/^\.(frame|ent|rel|k-)/.test(rule.selectorText || "")) css += rule.cssText;
  const st = document.createElementNS(NS, "style"); st.textContent = css; out.insertBefore(st, out.firstChild);
  const bg = document.createElementNS(NS, "rect"); for (const [k, v] of Object.entries({x: b.x1 - m, y: b.y1 - m - 40, width: w, height: hh, fill: cs.getPropertyValue("--bg").trim()})) bg.setAttribute(k, v);
  out.insertBefore(bg, st.nextSibling);
  return {text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(out), w, h: hh};
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const fname = (ext) => (($("#sub").textContent || "erd").replace(/[^\w가-힣.-]+/g, "_")) + "-" + S.stage + "." + ext;
$("#svg").addEventListener("click", () => { const s = exportSvg(); download(new Blob([s.text], {type: "image/svg+xml"}), fname("svg")); status("SVG 로 내보냈다"); });
$("#png").addEventListener("click", () => {
  const s = exportSvg(), img = new Image(), scale = 2;
  img.onload = () => { const c = document.createElement("canvas"); c.width = s.w * scale; c.height = s.h * scale; const x = c.getContext("2d"); x.scale(scale, scale); x.drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src); c.toBlob(b => { download(b, fname("png")); status("PNG 로 내보냈다"); }); };
  img.onerror = () => status("PNG 로 바꾸지 못했다 -- SVG 로 내보낸다", "bad");
  img.src = URL.createObjectURL(new Blob([s.text], {type: "image/svg+xml"}));
});

syncButtons(); status(S.live ? "읽는 중" : "적용을 누를 때 반영", S.live ? "" : "off");
if (!hasLayout()) status("배치 모듈(erdlayout.js)을 읽지 못해 간단한 격자로 놓는다", "bad");
load(false).then(listen);
</script>
</body>
