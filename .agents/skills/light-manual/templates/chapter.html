<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{feature}} — {{project}} 사용설명서</title>
<link rel="stylesheet" href="assets/manual.css">
<script defer src="assets/manual.js"></script>
</head>
<!-- 기능 장 (비전공자): 표지 → 한눈에 보기 → 한 단계 = 한 페이지 → 알아 두면 좋은 점. 쉬운 말, 그림 위주 -->
<body data-manual="{{project}} 사용설명서" data-index="index.html" data-chapters="">

<section class="slide" data-kind="cover" data-title="{{feature}}">
  <div class="body">
    <div class="emoji">📄</div>
    <h1><!-- 작성: 기능 이름 (화면에 보이는 말) --></h1>
    <p class="lead"><!-- 작성: 무엇을 할 수 있는지 한 줄 --></p>
  </div>
  <aside class="notes"><!-- 작성: 기능 소개 --></aside>
</section>

<section class="slide" data-kind="overview" data-title="한눈에 보기">
  <p class="kicker">한눈에 보기</p>
  <h2><!-- 작성: "세 단계면 됩니다" 처럼 --></h2>
  <div class="body">
    <ol class="flow">
      <li><b><!-- 작성 --></b><span><!-- 작성 --></span></li>
      <li class="on"><b><!-- 작성 --></b><span><!-- 작성 --></span></li>
      <li><b><!-- 작성 --></b><span><!-- 작성 --></span></li>
    </ol>
  </div>
  <aside class="notes"><!-- 작성: 전체 흐름 --></aside>
</section>

<section class="slide" data-kind="step" data-title="1단계">
  <p class="kicker">따라 하기 · 1 / 3</p>
  <h2><!-- 작성: 한 단계 = 한 동작 (화면 글자 그대로 <span class="ui">버튼</span>) --></h2>
  <div class="body">
    <div class="screen">
      <div class="top"><span class="t"><!-- 작성: 화면 이름 --></span></div>
      <div class="in"><div class="field hl"><!-- 작성: 누르거나 적는 곳 --></div></div>
    </div>
    <div class="callout"><!-- 작성: 이렇게 보이면 성공 --></div>
  </div>
  <aside class="notes"><!-- 작성: 무엇을 누르면 무엇이 보이는지. 단계마다 페이지를 하나씩 --></aside>
</section>

</section>

</html>
