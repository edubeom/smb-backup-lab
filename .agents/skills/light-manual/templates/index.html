<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project}} 사용설명서</title>
<link rel="stylesheet" href="assets/manual.css">
<script defer src="assets/manual.js"></script>
</head>
<!-- 비전공자용 목차. 페이지(section.slide) 하나 = pptx 한 장. 페이지마다 그림 + 대본(aside.notes). 쉬운 말. -->
<body data-manual="{{project}} 사용설명서" data-index="index.html" data-chapters="">

<section class="slide" data-kind="cover" data-title="{{project}} 사용설명서">
  <div class="body">
    <div class="emoji">🏡</div>
    <h1>{{project}} 사용설명서</h1>
    <p class="lead"><!-- 작성: 무엇을 하는 곳인지 한 줄 --></p>
  </div>
  <aside class="notes"><!-- 작성: 인사 + 이 설명서로 무엇을 할 수 있게 되는지 --></aside>
</section>

<section class="slide" data-kind="concept" data-title="한눈에 보기">
  <p class="kicker">한눈에 보기</p>
  <h2><!-- 작성: 핵심 한 문장 --></h2>
  <div class="body">
    <div class="cards">
      <div class="card"><i>🗒️</i><b><!-- 작성: 기능 --></b><span><!-- 작성: 무엇을 하나 --></span></div>
    </div>
  </div>
  <aside class="notes"><!-- 작성: 기능을 하나씩 짧게 소개 --></aside>
</section>

<section class="slide" data-kind="start-step" data-title="시작하기 1">
  <p class="kicker">시작하기 · 1 / 2</p>
  <h2><!-- 작성: 이 단계에서 할 한 가지 (예: 파일을 두 번 누릅니다) --></h2>
  <div class="body">
    <div class="screen">
      <div class="top"><span class="t"><!-- 작성: 보이는 화면 이름 --></span></div>
      <div class="in"><div class="field hl"><!-- 작성: 누르는 곳 --></div></div>
    </div>
    <div class="callout"><!-- 작성: 이렇게 보이면 성공 --></div>
  </div>
  <aside class="notes"><!-- 작성: 영상에서 말하듯이 60자 이상 -- 무엇을 누르고 무엇이 보이는지. 단계마다 페이지를 하나씩 --></aside>
</section>

<section class="slide" data-kind="start-step" data-title="시작하기 2">
  <p class="kicker">시작하기 · 2 / 2</p>
  <h2><!-- 작성: 이 단계에서 할 한 가지 (예: 파일을 두 번 누릅니다) --></h2>
  <div class="body">
    <div class="screen">
      <div class="top"><span class="t"><!-- 작성: 보이는 화면 이름 --></span></div>
      <div class="in"><div class="field hl"><!-- 작성: 누르는 곳 --></div></div>
    </div>
    <div class="callout"><!-- 작성: 이렇게 보이면 성공 --></div>
  </div>
  <aside class="notes"><!-- 작성: 영상에서 말하듯이 60자 이상 -- 무엇을 누르고 무엇이 보이는지. 단계마다 페이지를 하나씩 --></aside>
</section>

<section class="slide" data-kind="chapters" data-title="기능 목록">
  <p class="kicker">기능 목록</p>
  <h2>보고 싶은 기능을 누르세요</h2>
  <div class="body">
    <div class="cards">
      <a class="card" href="기능.html"><i>📄</i><b><!-- 작성: 기능 이름 --></b><span><!-- 작성: 한 줄 설명 --></span></a>
    </div>
  </div>
  <aside class="notes"><!-- 작성: 기능별 설명서 안내 --></aside>
</section>

<section class="slide" data-kind="changes" data-title="바뀐 점">
  <p class="kicker">바뀐 점</p>
  <h2>최근에 바뀐 것 (최신이 위)</h2>
  <div class="body">
    <table class="grid">
      <tr><th>날짜</th><th>무엇이 바뀌었나</th></tr>
      <tr><td><!-- 작성: YYYY-MM-DD --></td><td><!-- 작성: 바뀐 내용 --></td></tr>
    </table>
  </div>
  <aside class="notes"><!-- 작성: 가장 최근 변경 --></aside>
</section>

</body>
</html>
